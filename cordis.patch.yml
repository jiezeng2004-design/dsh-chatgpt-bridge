# dsh-chatgpt-bridge bundle patch.
#
# Only insert the bridge row. dsh-web-app already mounts storage / workspace /
# session-projection-cache; a second insert of those ids crashes the loader
# (`duplicate loader entry id: storage`) and is exactly why a dual-profile
# boot cannot be "the same rows, later layer wins".
#
# DSH 0.1.7-rc.2 base-backed headless profiles already own storage/cache;
# add only workspace via cordis.headless.patch.yml (never over Web).
- insert:
    - id: chatgpt-bridge
      name: 'dsh-chatgpt-bridge'
      config:
        transport: http
        host: 127.0.0.1
        port: 3456
        authMode: token
        authToken: ''
        authTokenEnv: DSH_CHATGPT_BRIDGE_TOKEN
        tokenFile: ''
        resultMaxChars: 8000
        resultMaxItems: 50
        sessionMaxItems: 20
        sessionMaxChars: 4000
